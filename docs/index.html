<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NurseRoster</title><style>body{font:16px Tahoma,Arial;background:#f3f7fa;color:#17354a;margin:0}header{background:#075174;color:white;padding:20px}main{max-width:1100px;margin:auto;padding:16px}.card{background:white;padding:18px;border-radius:12px;margin:14px 0}input,select,button{padding:9px;margin:5px;border:1px solid #cdd6df;border-radius:7px}button{background:#0875a2;color:white;cursor:pointer}.hidden{display:none}table{border-collapse:collapse;width:100%}th,td{border:1px solid #ddd;padding:8px;text-align:center}.scroll{overflow:auto}#notice{color:#a32323}</style></head><body><header><b>🏥 NurseRoster — رغبات التمريض</b> <span id="identity"></span><button id="logout" class="hidden">خروج</button></header><main><p id="notice"></p><section id="login" class="card"><h2>تسجيل الدخول</h2><form id="loginForm"><input id="username" placeholder="اسم المستخدم أو البريد" required autocomplete="username"><input id="password" type="password" placeholder="كلمة المرور" required autocomplete="current-password"><button>دخول</button></form></section><section id="app" class="hidden"><div class="card"><input id="month" type="month"><button id="reload">تحديث</button><strong id="status"></strong></div><section id="nurse" class="card hidden"><h2>رغباتي</h2><div class="scroll"><table><thead><tr><th>التاريخ</th><th>الرغبة</th><th>الروستر المعتمد</th><th>حفظ</th></tr></thead><tbody id="nurseRows"></tbody></table></div></section><section id="admin" class="hidden"><div class="card"><h2>لوحة المشرف</h2><select id="periodStatus"><option value="open">فتح الرغبات</option><option value="closed">إغلاق الرغبات</option><option value="published">نشر الروستر</option></select><button id="saveStatus">حفظ حالة الشهر</button><button id="export">تصدير CSV</button></div><div class="card scroll"><h2>الرغبات والتوزيع</h2><table><thead id="adminHead"></thead><tbody id="adminRows"></tbody></table></div><div class="card scroll"><h2>سجل تعديلات المشرفين</h2><table><thead><tr><th>التاريخ والوقت</th><th>المشرف</th><th>الممرض</th><th>اليوم</th><th>قبل</th><th>بعد</th></tr></thead><tbody id="auditRows"></tbody></table></div></section></section></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
import {SUPABASE_URL,SUPABASE_ANON_KEY} from './config.js';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const codes=['E','N','8','#'];let db,me,profile,period,people=[],prefs=[],assign=[];
const note=s=>$('notice').textContent=s,show=(id,v)=>$(id).classList.toggle('hidden',!v);
$('month').value=new Date().toLocaleDateString('en-CA').slice(0,7);
const dates=()=>{const [y,m]=$('month').value.split('-').map(Number);return Array.from({length:new Date(y,m,0).getDate()},(_,i)=>$('month').value+'-'+String(i+1).padStart(2,'0'));};
const opts=(v,empty=false)=>(empty?'<option value="">—</option>':'')+codes.map(c=>'<option '+(c===v?'selected':'')+'>'+c+'</option>').join('');
async function check(res){if(res.error)throw res.error;return res.data;}
async function session(){const {data:{user}}=await db.auth.getUser();me=user;show('login',!me);show('app',!!me);show('logout',!!me);if(!me)return;profile=await check(await db.from('profiles').select('*').eq('id',me.id).single());$('identity').textContent=' | '+profile.full_name;show('nurse',profile.role==='nurse');show('admin',profile.role==='admin');await load();}
async function load(){if(!profile)return;const first=$('month').value+'-01',last=dates().at(-1);const [p,pr,a,us]=await Promise.all([db.from('periods').select('*').eq('month',first).maybeSingle(),db.from('preferences').select('*').gte('work_date',first).lte('work_date',last),db.from('assignments').select('*').gte('work_date',first).lte('work_date',last),profile.role==='admin'?db.from('profiles').select('*').order('full_name'):Promise.resolve({data:[]})]);period=await check(p)||{month:first,status:'closed'};prefs=await check(pr);assign=await check(a);people=(await check(us)).filter(x=>x.role==='nurse');$('status').textContent='الحالة: '+period.status;if(profile.role==='admin'){renderAdmin();await audit();}else renderNurse();}
function renderNurse(){const p=new Map(prefs.filter(x=>x.user_id===me.id).map(x=>[x.work_date,x.shift_code])),a=new Map(assign.filter(x=>x.user_id===me.id).map(x=>[x.work_date,x.shift_code]));$('nurseRows').innerHTML=dates().map(d=>'<tr><td>'+d+'</td><td><select data-date="'+d+'" '+(period.status!=='open'?'disabled':'')+'>'+opts(p.get(d))+'</select></td><td>'+(period.status==='published'?(a.get(d)||'—'):'لم يُنشر')+'</td><td><button class="savePref" data-date="'+d+'" '+(period.status!=='open'?'disabled':'')+'>حفظ</button></td></tr>').join('');}
function renderAdmin(){const p=new Map(prefs.map(x=>[x.user_id+'|'+x.work_date,x.shift_code])),a=new Map(assign.map(x=>[x.user_id+'|'+x.work_date,x.shift_code]));$('periodStatus').value=period.status;$('adminHead').innerHTML='<tr><th>الممرض</th>'+dates().map(d=>'<th>'+d.slice(-2)+'</th>').join('')+'</tr>';$('adminRows').innerHTML=people.map(u=>'<tr><th>'+esc(u.full_name)+'</th>'+dates().map(d=>'<td><small>رغبة: '+esc(p.get(u.id+'|'+d)||'—')+'</small><br><select class="assignment" data-user="'+u.id+'" data-date="'+d+'" '+(period.status==='published'?'disabled':'')+'>'+opts(a.get(u.id+'|'+d),true)+'</select></td>').join('')+'</tr>').join('');}
async function audit(){const rows=await check(await db.from('roster_audit').select('*').order('happened_at',{ascending:false}).limit(100));const ids=[...new Set(rows.flatMap(x=>[x.actor_id,x.subject_id]).filter(Boolean))];const profiles=ids.length?await check(await db.from('profiles').select('id,full_name').in('id',ids)):[];const names=new Map(profiles.map(x=>[x.id,x.full_name]));$('auditRows').innerHTML=rows.map(x=>'<tr><td>'+esc(new Date(x.happened_at).toLocaleString('ar-EG'))+'</td><td>'+esc(names.get(x.actor_id)||'—')+'</td><td>'+esc(names.get(x.subject_id)||'—')+'</td><td>'+esc(x.work_date)+'</td><td>'+esc(x.old_shift||'—')+'</td><td>'+esc(x.new_shift||'—')+'</td></tr>').join('');}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{let u=$('username').value.trim();if(!u.includes('@')){if(!/^[a-zA-Z0-9_-]{3,40}$/.test(u))throw Error('اسم المستخدم غير صالح');u+='@roster.invalid';}await check(await db.auth.signInWithPassword({email:u,password:$('password').value}));await session();note('');}catch(e){note(e.message);}};
$('logout').onclick=async()=>{await db.auth.signOut();profile=null;await session();};
$('reload').onclick=()=>load().catch(e=>note(e.message));$('month').onchange=$('reload').onclick;
$('nurseRows').onclick=async e=>{if(!e.target.matches('.savePref'))return;try{const d=e.target.dataset.date;await check(await db.from('preferences').upsert({user_id:me.id,work_date:d,shift_code:document.querySelector('select[data-date="'+d+'"]').value},{onConflict:'user_id,work_date'}));note('تم حفظ رغبتك ليوم '+d);await load();}catch(err){note(err.message);}};
$('saveStatus').onclick=async()=>{try{await check(await db.from('periods').upsert({month:$('month').value+'-01',status:$('periodStatus').value},{onConflict:'month'}));note('تم تحديث حالة الشهر');await load();}catch(e){note(e.message);}};
$('adminRows').onchange=async e=>{if(!e.target.matches('.assignment')||!e.target.value)return;try{await check(await db.from('assignments').upsert({user_id:e.target.dataset.user,work_date:e.target.dataset.date,shift_code:e.target.value},{onConflict:'user_id,work_date'}));note('تم حفظ التعديل وتسجيل المشرف');await load();}catch(err){note(err.message);}};
$('export').onclick=()=>{const a=new Map(assign.map(x=>[x.user_id+'|'+x.work_date,x.shift_code]));const rows=[['الموظف',...dates()],...people.map(u=>[u.full_name,...dates().map(d=>a.get(u.id+'|'+d)||'')])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='roster-'+$('month').value+'.csv';link.click();URL.revokeObjectURL(url);};
if(SUPABASE_URL.startsWith('YOUR_')||SUPABASE_ANON_KEY.startsWith('YOUR_')){note('لازم تضبط docs/config.js ببيانات Supabase الأول.');}else{db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);session().catch(e=>note(e.message));}
</script></body></html>
